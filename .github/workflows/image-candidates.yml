name: Collect dish photo candidates (one-off)
on:
  push:
    branches: [image-candidates]
    paths: [scripts/fetch-candidates.mjs, .github/workflows/image-candidates.yml]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save sharp@0.33.5
      - run: node scripts/fetch-candidates.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates
          git commit -m "Add dish photo candidates [skip ci]"
          git push
